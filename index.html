<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Axon: Synaptic Breach</title>
<meta name="description" content="Axon: Synaptic Breach - un plataformas de accion protagonizado por Volt, un pulso bioelectrico consciente. Obra de ficcion.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch" aria-hidden="true">
    <div class="tgroup tleft">
      <button id="tLeft" class="tbtn">&#9664;</button>
      <button id="tRight" class="tbtn">&#9654;</button>
    </div>
    <div class="tgroup tright">
      <button id="tSprint" class="tbtn tsmall">R</button>
      <button id="tAction" class="tbtn tsmall">B</button>
      <button id="tJump" class="tbtn">A</button>
    </div>
    <button id="tPause" class="tbtn tpause">II</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
